<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Large geometric decorative pattern — used as subtle background watermark -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="0.5">
    <!-- Outer frame -->
    <rect x="40" y="40" width="720" height="720" stroke-opacity="0.06"/>
    <rect x="80" y="80" width="640" height="640" stroke-opacity="0.04"/>

    <!-- Diagonal grid lines -->
    <line x1="0" y1="0" x2="800" y2="800" stroke-opacity="0.03"/>
    <line x1="200" y1="0" x2="800" y2="600" stroke-opacity="0.02"/>
    <line x1="0" y1="200" x2="600" y2="800" stroke-opacity="0.02"/>
    <line x1="0" y1="400" x2="400" y2="800" stroke-opacity="0.02"/>
    <line x1="400" y1="0" x2="800" y2="400" stroke-opacity="0.02"/>

    <!-- Horizontal/vertical structure lines -->
    <line x1="400" y1="0" x2="400" y2="800" stroke-opacity="0.04"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke-opacity="0.04"/>

    <!-- Node points at intersections -->
    <circle cx="400" cy="400" r="6" fill="white" fill-opacity="0.08"/>
    <circle cx="400" cy="400" r="20" fill="white" fill-opacity="0.02"/>

    <circle cx="200" cy="200" r="3" fill="white" fill-opacity="0.06"/>
    <circle cx="600" cy="200" r="3" fill="white" fill-opacity="0.06"/>
    <circle cx="200" cy="600" r="3" fill="white" fill-opacity="0.06"/>
    <circle cx="600" cy="600" r="3" fill="white" fill-opacity="0.06"/>

    <!-- Concentric rings -->
    <circle cx="400" cy="400" r="280" stroke-opacity="0.03"/>
    <circle cx="400" cy="400" r="160" stroke-opacity="0.03"/>
  </g>
</svg>
