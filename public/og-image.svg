<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0f0f0f"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Watermark pattern -->
  <g stroke="white" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <circle cx="600" cy="315" r="200" stroke-opacity="0.04"/>
    <circle cx="600" cy="315" r="120" stroke-opacity="0.03"/>
  </g>

  <!-- Logo mark — node network -->
  <g transform="translate(600, 200)">
    <circle cx="0" cy="-40" r="5" fill="white" fill-opacity="0.9"/>
    <circle cx="-35" cy="25" r="5" fill="white" fill-opacity="0.6"/>
    <circle cx="35" cy="25" r="4" fill="white" fill-opacity="0.5"/>
    <circle cx="0" cy="45" r="6" fill="white" fill-opacity="0.7"/>

    <line x1="0" y1="-40" x2="-35" y2="25" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="-35" y1="25" x2="35" y2="25" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="35" y1="25" x2="0" y2="-40" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="0" y1="45" x2="0" y2="-40" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="0" y1="45" x2="-35" y2="25" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="0" y1="45" x2="35" y2="25" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="400" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="300" font-size="48" letter-spacing="0.2em">
    NODERUM
  </text>

  <!-- Tagline -->
  <text x="600" y="445" text-anchor="middle" fill="white" fill-opacity="0.4" font-family="monospace" font-size="16" letter-spacing="0.12em">
    VI BYGGER OPERATIVA AI-BOLAG FÖR SVERIGE
  </text>

  <!-- Bottom accent line -->
  <line x1="540" y1="475" x2="660" y2="475" stroke="white" stroke-opacity="0.08" stroke-width="0.5"/>
</svg>
