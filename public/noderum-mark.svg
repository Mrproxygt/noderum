<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer ring — subtle orbit -->
  <circle cx="100" cy="100" r="94" stroke="white" stroke-opacity="0.08" stroke-width="0.5"/>
  <circle cx="100" cy="100" r="86" stroke="white" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Interconnecting lines — node network -->
  <line x1="100" y1="38" x2="62" y2="128" stroke="white" stroke-opacity="0.12" stroke-width="0.5"/>
  <line x1="62" y1="128" x2="148" y2="95" stroke="white" stroke-opacity="0.12" stroke-width="0.5"/>
  <line x1="148" y1="95" x2="100" y2="38" stroke="white" stroke-opacity="0.12" stroke-width="0.5"/>
  <line x1="100" y1="38" x2="100" y2="160" stroke="white" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="62" y1="128" x2="100" y2="160" stroke="white" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="148" y1="95" x2="100" y2="160" stroke="white" stroke-opacity="0.06" stroke-width="0.5"/>

  <!-- Top node -->
  <circle cx="100" cy="38" r="4" fill="white" fill-opacity="0.9"/>
  <circle cx="100" cy="38" r="12" fill="white" fill-opacity="0.04"/>

  <!-- Left node -->
  <circle cx="62" cy="128" r="4" fill="white" fill-opacity="0.6"/>
  <circle cx="62" cy="128" r="10" fill="white" fill-opacity="0.03"/>

  <!-- Right node -->
  <circle cx="148" cy="95" r="3" fill="white" fill-opacity="0.5"/>
  <circle cx="148" cy="95" r="8" fill="white" fill-opacity="0.02"/>

  <!-- Center node — brightest, the "room" -->
  <circle cx="100" cy="160" r="5" fill="white" fill-opacity="0.7"/>
  <circle cx="100" cy="160" r="16" fill="white" fill-opacity="0.02"/>
</svg>
